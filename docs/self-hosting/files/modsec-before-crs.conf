# /etc/nginx/modsec/before-crs.conf
#
# Runtime rules for EVERY site nginx serves, evaluated per request before the
# Core Rule Set (phase 1, before the body is read). main.conf loads this file at
# http level, so only what is true of nginx or of every app on the box belongs
# here — protocol facts, never an app's routes. MixTape's own exclusions are in
# modsec/mixtape.conf, loaded by its vhosts (05-hardening.md §3).
#
# Local rule ids are 10000-10099 for MixTape. CRS reserves 1-99,999 for local
# rules; give another app on the box a range of its own.
