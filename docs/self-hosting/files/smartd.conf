# /etc/smartd.conf   — 644 root:root
#
# What smartd (smartmontools) watches, how, and who hears about it. It checks
# every 30 minutes (Debian's default interval) and hands a warning to
# /usr/local/sbin/smartd-notify, which sends it through notify as the app "host"
# (/etc/notify/apps.json). smartd sends no mail of its own, so the box needs no
# mail server. Debian's stock file, which documents every directive, stays
# beside it as /root/smartd.conf.dist.
#
# One line per disk, BY ID, never /dev/sdX: a second USB disk plugged in can
# take over sda, and smartd would then watch it under the backup drive's line.
# `ls -l /dev/disk/by-id/` lists the names, `smartctl --scan-open` each disk's
# type. Replace both <…-id> below.
#
#   -a          health status, attributes (reallocated and pending sectors, an
#               SSD's spare blocks and wear), error and self-test logs. An NVMe
#               drive's error log may hold thousands of "Invalid Field in
#               Command" entries — the kernel probing features the drive lacks;
#               smartd logs those at info and does not alert.
#   -s (S/../../7/12|L/../01/./10)
#               a short self-test on Sundays at 12:00, a long one on the 1st at
#               10:00: daylight, clear of the nightly dump (02:30), restic run
#               (04:00) and library scan (05:30). A long test of a 2 TB USB hard
#               disk takes about six hours; the disk stays usable meanwhile.
#   -W 0,0,N    alert at N °C, nothing below. An NVMe drive states its own limit
#               (smartctl -a, "Warning Comp. Temp. Threshold"); hard disks are
#               typically rated to 55–60 °C.
#   -d sat      the USB bridge passes SMART through as ATA commands. A bridge
#               that passes nothing makes `smartctl -a -d sat` come back empty;
#               the drive is then watched by restic's weekly check alone.
#   -d removable
#               start without the drive when it is unplugged. Without it smartd
#               refuses to start at all, and then watches the system disk no
#               more than the missing one. A missing drive already fails the
#               restic run, which alerts.
#   -m <nomailer> -M exec
#               no mail, run the program instead. While a problem lasts, smartd
#               repeats it once a day (its default with Debian's state files in
#               /var/lib/smartmontools).
#
# Check a change with `smartd -q showtests` (parses this file, lists the next
# self-tests) before `systemctl restart smartmontools`.

# The system disk.
/dev/disk/by-id/<system-disk-id> -a -s (S/../../7/12|L/../01/./10) -W 0,0,80 -m <nomailer> -M exec /usr/local/sbin/smartd-notify
# The backup drive, on USB.
/dev/disk/by-id/<backup-drive-id> -d sat -d removable -a -s (S/../../7/12|L/../01/./10) -W 0,0,55 -m <nomailer> -M exec /usr/local/sbin/smartd-notify
