# /etc/nginx/conf.d/mixtape-modsecurity.conf
#
# Loads the WAF's rules ONCE, at http level, and switches the WAF on nowhere.
# Each vhost turns it on inside its `location ~ \.php$` with `modsecurity on;`.
# 05-hardening.md §3 explains why it has to be that location and not the whole
# server.
#
# Requires libnginx-mod-http-modsecurity, which loads the module itself through
# modules-enabled/. The engine mode (DetectionOnly or On) is `SecRuleEngine` in
# /etc/nginx/modsec/main.conf, so switching between the two never touches a vhost.
modsecurity_rules_file /etc/nginx/modsec/main.conf;
