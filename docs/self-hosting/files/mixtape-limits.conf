# /etc/nginx/conf.d/mixtape-limits.conf
#
# Rate-limit and connection-limit zones for the prod site.
#
# These MUST live in the http context (i.e. conf.d/, which nginx.conf includes
# at line 60) — `limit_req_zone`, `limit_conn_zone` and `map` are all invalid
# inside a server{} block. The vhost only references them via limit_req /
# limit_conn.
#
# Defining a zone costs nothing until a server block uses it, so the dev vhost
# is unaffected by this file existing — which is also why this whole class of
# failure is invisible until prod.

# --- Which bucket a request falls in ----------------------------------------
#
# THREE ZONES, NOT ONE.
#
# Everything the app answers is a PHP request — a page load, a cover thumbnail,
# and the audio stream alike — so a single zone in front of `location ~ \.php$`
# puts all three in ONE bucket per visitor. Pressing "play" on a large artist
# queues every track at once, the queue panel renders a row each, and every
# visible row fetches its cover: the burst is spent on thumbnails in one tick,
# and then the STREAM REQUEST — the only one that matters — is refused.
#
# NOT THE CAUSE OF THE 2026-08-11 OUTAGE, though it was written for it. That was
# `limit_conn` in the vhost counting HTTP/2 STREAMS as connections, with a
# ceiling below what one page load needs; the giveaway was /favicon.ico being
# refused too, which no limit_req here can reach. The split stays because the
# shared bucket is a real latent problem — it costs nothing, and it is what
# keeps thumbnails from starving audio now that the connection ceiling is no
# longer hiding the question. If you are debugging a 429, read the error log
# first: it names both the KIND of limit and the zone.
#
# AN EMPTY KEY IS NOT ACCOUNTED — nginx's documented way to exempt a request
# from a zone. Each map below yields the client address for the requests that
# belong to its zone and an empty string for everything else, so a request lands
# in exactly one bucket and the three cannot starve one another.
#
# KEYED OFF `$request_uri`, THE ORIGINAL CLIENT URI, and that is load-bearing:
# the limits are applied inside `location ~ \.php$`, which these requests only
# reach after `try_files` has internally rewritten them, so by then `$uri` is
# `/index.php` for every one of them and could not tell them apart.
# `$request_uri` survives an internal redirect unchanged.
#
# The regexes are QUOTED because they contain `{36}` — nginx requires quoting
# for any directive value containing `{` or `}`, and an unquoted one is a
# parse error rather than a rule that silently never matches. The media URLs are
# UUID-shaped by route constraint (`->whereUuid(…)` in routes/web.php), so
# matching that shape here cannot catch an ordinary page by accident.
#
# Maps are declared before the zones that read them. nginx resolves variables
# lazily and would accept either order, but this one reads in the direction the
# request actually flows.

map $request_uri $mx_cover_key {
    default                                        "";
    "~^/music/(songs|albums)/[0-9a-f-]{36}/cover$"  $binary_remote_addr;
}

map $request_uri $mx_stream_key {
    default                                        "";
    "~^/music/songs/[0-9a-f-]{36}/stream$"          $binary_remote_addr;
}

# Everything else — written as the INVERSE of the two above rather than as its
# own pattern, so a request can never be counted in two zones, and so adding a
# media route to a map above automatically takes it out of this one.
map "$mx_cover_key$mx_stream_key" $mx_pages_key {
    default  "";
    ""       $binary_remote_addr;
}

# --- The zones themselves ----------------------------------------------------
#
# 10m of shared memory tracks roughly 160k unique IPs per zone — far more than
# this box will ever see. The burst and delay per zone are the VHOST's, since
# they are about what each kind of request can tolerate; see mixtape.prod.nginx.conf.
#
# A ZONE'S KEY CANNOT BE CHANGED BY A RELOAD, which is why the first of these is
# `mx_pages` and not the `mx_dynamic` it was called until 2026-08-11. Re-keying
# an existing zone makes the master refuse the whole config:
#
#   [emerg] limit_req "mx_dynamic" uses the "$mx_dynamic_key" key
#           while previously it used the "$binary_remote_addr" key
#
# AND IT FAILS SILENTLY IN BOTH THE PLACES YOU WOULD LOOK. `nginx -t` PASSES,
# because it tests in a fresh process that has no prior zone to disagree with;
# and `systemctl reload nginx` exits 0 and logs "Reloaded", because systemd only
# sees the signal being delivered, not the master's rejection of it. The old
# workers keep serving the old config, so every edit appears to do nothing —
# which is exactly how an afternoon disappears.
#
# Renaming sidesteps it: a new name is a new zone, with no previous key to
# contradict. (A full `systemctl restart nginx` also clears it, at the cost of
# dropping in-flight requests.) After any reload, the honest check is whether
# the WORKERS are new — `ps -o pid,lstart -C nginx`, not the config on disk.
limit_req_zone  $mx_pages_key        zone=mx_pages:10m   rate=30r/s;
limit_req_zone  $mx_cover_key        zone=mx_cover:10m   rate=30r/s;
limit_req_zone  $mx_stream_key       zone=mx_stream:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr  zone=mx_conn:10m;

# 429 rather than nginx's default 503: 503 means "server unavailable" and would
# be indistinguishable from Laravel's maintenance page in the logs, and it also
# tells well-behaved clients the wrong thing. 429 says "you, specifically, are
# going too fast".
limit_req_status  429;
limit_conn_status 429;
