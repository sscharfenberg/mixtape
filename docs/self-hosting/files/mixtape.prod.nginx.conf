# /etc/nginx/sites-available/mixtape.prod
#
# MixTape v2 — production vhost. Mirrors mixtape.dev, but:
#   - owns the `default_server` flag (must be REMOVED from mixtape.dev at the same time)
#   - talks to the isolated `mixtape-prod` php-fpm pool
#   - ships the FULL CSP (dev only runs the resource-agnostic hardening subset,
#     because Vite HMR loads scripts + a wss from the :5174 vhost)
#
# TEMPLATE. Replace <your-domain> throughout before installing.
# The "managed by Certbot" if-blocks duplicate the location / redirect below —
# harmless, and certbot re-adds them on renewal, so leave them alone.
# Step 4 (certbot --nginx) rewrites the ssl_certificate* lines and the redirect.

server {
    if ($host = <your-domain>) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = <your-domain>) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

                                    # HTTP -> HTTPS (+ ACME path kept)
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name <your-domain>;

    location /.well-known/acme-challenge/ { allow all; root /var/www/html; }
    location /                             { return 301 https://$host$request_uri; }




}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name <your-domain>;

    root  /var/www/mixtape.prod/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/<your-domain>/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/<your-domain>/privkey.pem; # managed by Certbot

    access_log /var/log/nginx/mixtape.prod.access.log;
    error_log  /var/log/nginx/mixtape.prod.error.log;

    # --- Abuse limits -----------------------------------------------------
    # Zones are defined in conf.d/mixtape-limits.conf (http context).
    #
    # `limit_conn` COUNTS HTTP/2 STREAMS, NOT TCP CONNECTIONS, and that is the
    # whole reason these two numbers look the way they do. With `http2 on`, a
    # browser opens ONE connection and multiplexes every request over it — so a
    # page that asks for thirty cover thumbnails has thirty "connections" as far
    # as this directive is concerned.
    #
    # "A browser opens about six connections per host" is the rule of thumb that
    # sizes this wrongly: true under HTTP/1.1, meaningless with http2 on. At 20,
    # the Now Playing page — a cover per queue row — was refused 105 times over,
    # taking the audio stream and even /favicon.ico with it, all 429. A STATIC
    # FILE BEING REFUSED IS THE TELL that this and not the rate limit is what is
    # firing: limit_req only guards the PHP location.
    #
    # So: bound the STREAMS explicitly, and keep the connection limit above that
    # ceiling rather than below it.
    #
    # `http2_max_concurrent_streams` is the polite half. Excess streams are
    # QUEUED by the client rather than refused — the browser simply sends the
    # next request when one finishes — so a page wanting a hundred thumbnails
    # gets all hundred, 64 at a time, with no error anywhere.
    http2_max_concurrent_streams 64;

    # And the crude half, which is now about what it always claimed to be:
    # somebody opening parallel connections to saturate a home uplink. One
    # browser connection can contribute at most the 64 above, so this leaves
    # room for a few real tabs and still stops a scraper opening hundreds.
    limit_conn mx_conn 256;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # --- Media hand-off (X-Accel-Redirect) --------------------------------
    # SongStreamController answers /music/songs/{id}/stream with an empty body
    # plus `X-Accel-Redirect: /internal-media/music/<path>`, and nginx serves the
    # bytes from here. `internal` makes these locations unreachable from outside —
    # a request straight to /internal-media/... is a 404 — so the auth check in the
    # controller is not bypassable, while php-fpm is freed the moment the header is
    # written instead of being held for the length of a song. nginx also answers
    # HTTP Range natively, which is what makes dragging the timeline work.
    #
    # The trailing slashes on BOTH the location and the alias are load-bearing, and
    # each alias must match the matching MIXTAPE_*_PATH in .env. Enable
    # MIXTAPE_STREAM_INTERNAL_PREFIX=/internal-media alongside these; with it unset
    # the app streams through PHP instead (correct for a dev box, wrong here).
    location /internal-media/music/ {
        internal;
        alias /var/media/music/;
    }

    # The audiobook chapter stream hands off here, exactly as music does — see
    # the note above the music location for what X-Accel-Redirect is doing.
    location /internal-media/audiobooks/ {
        internal;
        alias /var/media/audiobooks/;
    }

    location ~ \.php$ {
        # THREE LIMITS, ONE PER KIND OF REQUEST. Every one of these is a PHP
        # request — a page, a cover, the audio stream — so a single zone put all
        # three in one bucket per visitor, and playing a large artist spent the
        # whole burst on thumbnails before the stream was even asked for. See
        # conf.d/mixtape-limits.conf for the maps that sort them, and why an
        # empty key is what keeps them from counting against each other.
        #
        # PAGES. 30r/s, burst 60, applied to dynamic requests only — static
        # assets under /build are served straight from disk and cost nothing. A
        # page load is one PHP request, so a real user never comes close; a
        # scanner walking paths at machine speed gets 429s. `nodelay` serves the
        # burst immediately rather than queueing it, so legitimate traffic never
        # feels artificially slow.
        limit_req zone=mx_pages burst=60 nodelay;

        # COVERS. A big burst is the NORMAL shape here, not abuse: a 25-row
        # table or a freshly filled play queue asks for a thumbnail per row in
        # one tick. So the ceiling is high — and `delay=60` rather than
        # `nodelay` is the important half: past the first 60, requests are
        # QUEUED and released at 30r/s instead of being refused. A cover that
        # arrives 200ms late is invisible; a 429 is a permanently broken image,
        # because the <img> does not retry. They are cached for 30 days with an
        # ETag (SongCoverController), so this bites on a first visit only.
        limit_req zone=mx_cover burst=200 delay=60;

        # THE STREAM, in a bucket of its own so nothing above can starve it —
        # which is the failure this split exists to prevent. The rate looks low
        # and is not: one request starts a track, and a few more arrive per
        # SEEK, since a Range request past what the browser has buffered
        # re-enters PHP before nginx takes over the bytes (X-Accel-Redirect,
        # below). `nodelay` because audio that is queued is audio that stutters.
        limit_req zone=mx_stream burst=20 nodelay;

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/mixtape-prod.sock;
        # Kept in step with the pool's request_terminate_timeout (300s). With the
        # hand-off above enabled, audio does NOT pass through here — this covers
        # the slowest ordinary request (a library scan kicked off by hand) and the
        # fallback path if MIXTAPE_STREAM_INTERNAL_PREFIX is ever cleared, where
        # PHP streams whole songs again and a short timeout would truncate them.
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* { deny all; }

    # --- Security headers -------------------------------------------------
    # ALL header directives live in this server{} block on purpose: a single
    # add_header inside any location{} would drop every inherited header for
    # that location (nginx's header-inheritance trap).
    # HSTS. The whole product is links pasted into chat apps, so the first hit on
    # a `/s/{uuid}` share URL is the one that matters — and `upgrade-insecure-requests`
    # in the CSP below does NOT cover it: that upgrades subresources and navigations
    # started from an already-loaded page, and does nothing for a cold `http://` URL
    # on a hostile network, which is stripped and served in plaintext before the 301
    # is ever trusted. No `preload` — that is a one-way door: it commits every present
    # and future subdomain of the apex to HTTPS, and removal takes months.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff                     always;
    add_header X-Frame-Options        SAMEORIGIN                  always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # Full CSP — prod serves built assets from 'self' with no dev server.
    #   script-src 'unsafe-inline' : required by the inline pre-paint theme script
    #                                (nginx cannot emit per-request nonces)
    #   style-src  'unsafe-inline' : required by Vue's v-bind() inline styles
    # Both still block external-origin loads. Follow-up worth doing later: move
    # CSP into Laravel middleware with per-request nonces (spatie/laravel-csp)
    # to drop script-src 'unsafe-inline'.
    #
    # `media-src 'self'` needs NO widening: the player is a native <audio> whose
    # src is a same-origin route (docs/player.md). A library that fed the element
    # from a Blob would need `blob:` here; this one does not.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    client_max_body_size 32M;



}
