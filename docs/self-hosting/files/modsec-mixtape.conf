# /etc/nginx/modsec/mixtape.conf — 644 root:root
#
# MixTape's ModSecurity exclusions. Loaded only by MixTape's vhosts, with
# `modsecurity_rules_file` beside `modsecurity on;` inside their
# `location ~ \.php$`, so nothing here reaches any other site nginx serves.
# Rules loaded by a vhost run before the shared rule set's rules of the same
# phase, so a phase-1 ctl here reaches every CRS rule. 05-hardening.md §3 has
# why the exclusions are a file of their own.
#
# Local rule ids 10000-10099; give another app on the box a range of its own.
# The paths match on REQUEST_FILENAME, the path without its query string, so
# keep them in step with routes/web.php and routes/web.auth.php.

# --- The bulk id lists: body not inspected -----------------------------------
# These routes take arrays of UUIDs and integers, and each one's FormRequest
# validates that exact shape server-side. The play-queue sync alone may carry
# 20,000 ids: twenty times SecArgumentsLimit. Without this exemption every CRS
# rule would run over every element on every track change. A UUID has nothing
# in it for a rule to find, so the body is skipped. Headers, cookies and the
# URL are still inspected.
#
# Every route that takes an id list must be listed here. In blocking mode, one
# that is missing answers 400 once its list passes 1,000 entries (rule 200007).
# That failure tends to show up months later, once a library is big enough to
# produce such a list.
SecRule REQUEST_FILENAME "@rx ^/(?:player/state|queue/tracks|playlists/order|playlists/[0-9a-f-]{36}/tracks(?:/order)?)$" \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:requestBodyAccess=Off"

# --- The credential routes: the raw body is never matched --------------------
# The password FIELDS are excluded on every route by 10003 below. That still
# leaves a handful of rules that also read REQUEST_BODY, the raw JSON with the
# password inside it, and a matching rule's log line would quote it whole. On
# these routes that variable is removed from every rule.
SecRule REQUEST_FILENAME "@rx ^/(?:login|register|reset-password|confirm-password|two-factor-challenge|password/entropy|user/(?:password|delete|confirmed-two-factor-authentication))$" \
    "id:10002,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_BODY"

# --- Credentials and the session cookie are never matched ---------------------
# When a rule matches, the matched value is written to the audit log and, in
# blocking mode, to nginx's error log. A password is free text: `--`, quotes,
# angle brackets, words like `select`. That is exactly what the injection rules
# match, and the app deliberately keeps submitted passwords out of every log it
# writes (04-going-public.md, "A dedicated auth-failure log"). Excluding the
# fields keeps the WAF from undoing that. The app hashes these values or
# compares them; it never interprets them. libmodsecurity names a JSON argument
# by its path, `json.<key>`; the bare names cover a urlencoded body. `json.p` is
# the password-strength meter's field, `json.code` / `json.recovery_code` the
# two-factor challenge's.
#
# The session cookie is Laravel ciphertext (encrypted and MACed), so a payload
# hidden in it cannot survive decryption, and a long base64 string is a classic
# false positive. Its name comes from APP_NAME (`Str::slug(APP_NAME).'-session'`)
# unless SESSION_COOKIE overrides it. Read the real one off a Set-Cookie header
# rather than assuming it:
#   curl -sI https://<your-domain>/login | grep -i set-cookie
# XSRF-TOKEN and remember_web_* are exempt for every host in after-crs.conf.
#
# A runtime SecAction, not SecRuleUpdateTargetByTag: those are configuration-
# time directives that edit rules in the parent context, which a file loaded by
# a vhost cannot reach.
SecAction "id:10003,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password_confirmation,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.current_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.p,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.recovery_code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password_confirmation,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:current_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:mixtape-session"
