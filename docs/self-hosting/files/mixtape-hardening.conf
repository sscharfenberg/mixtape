# /etc/nginx/conf.d/mixtape-hardening.conf
#
# http-context settings shared by every vhost. These live in conf.d/ for the same
# reason mixtape-limits.conf does: `map` and these ssl_* defaults are only valid
# in the http context.

# --- Request bodies the app never accepts ------------------------------------
# Nothing in MixTape takes a file upload, and every write is JSON. Inertia sends
# a form as JSON unless it contains a File, and none does; the plain `fetch()`
# calls all set `application/json`. So no real client ever sends a multipart
# body. Multipart parsing happens inside PHP's request startup, before any
# application code can look at the request, and PHP has had vulnerabilities in
# exactly that code. The prod vhost answers 415 to these requests before the
# body is read, so PHP never parses one.
#
# If a feature ever adds an upload, this rule has to change first. The symptom
# would be the upload answering 415 with nothing in Laravel's log.
map $content_type $mx_refuse_body {
    default          0;
    "~*^multipart/"  1;
}

# --- TLS ---------------------------------------------------------------------
# nginx.conf already sets ssl_protocols (TLS 1.2 + 1.3). Setting it again here is
# a "duplicate directive" error, so this file only adds what nginx.conf leaves out.
#
# The cipher list is Mozilla's "intermediate" profile. Without it nginx offers
# its default `HIGH:!aNULL:!MD5` on TLS 1.2, which includes the CBC, CAMELLIA
# and ARIA suites. The server accepts them, no modern client picks them, and
# they are why a scanner grades the setup down. TLS 1.3 suites are not set by
# this directive.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;

# Session tickets OFF. nginx encrypts tickets with a key that lives as long as
# its workers, and anyone holding that key can decrypt every session resumed
# with it. Forward secrecy is then only as good as the last restart. A shared
# session cache gives the same fast resumption without such a key. The zone has
# its own name because a `shared:` zone declared twice with different sizes is a
# startup error.
ssl_session_cache   shared:MixTapeTLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
