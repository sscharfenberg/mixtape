# MixTape — local development stack (docker compose)
# ===================================================
# A fully self-contained dev environment for working on the app away from home,
# where the real server (debbie) is only reachable over the LAN. Nothing here
# talks to debbie: its own Postgres, its own seeded demo library, live-reloading
# Vite. NOT for production (debbie deploys via git — docs/self-hosting/).
#
#   docker compose up --build      # first run: builds the PHP image, seeds demo data
#   open http://localhost:8080     # log in as  Ashaltiriak / passwort
#
# See docker/README.md for the details.

name: mixtape-dev

services:
    # PostgreSQL 17 — same major as debbie; its ICU support satisfies the
    # `case_insensitive` collation the migrations create.
    db:
        image: postgres:17
        environment:
            POSTGRES_DB: mixtape
            POSTGRES_USER: mixtape
            POSTGRES_PASSWORD: mixtape
        ports:
            # host:container — change the host side if 5432 is already taken.
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U mixtape -d mixtape"]
            interval: 5s
            timeout: 3s
            retries: 20

    # PHP-FPM 8.4 running Laravel. Source is bind-mounted for live editing; the
    # entrypoint installs deps (if missing), migrates, and seeds on first boot.
    app:
        build:
            context: .
            dockerfile: docker/app.Dockerfile
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - docker/app.env
        volumes:
            - .:/var/www
            # node_modules is a Linux-native install, kept out of the Mac's copy.
            - node_modules:/var/www/node_modules
            # To play REAL audio / scan a real library, mount a media folder and
            # set MIXTAPE_*_PATH in docker/app.env to its in-container path:
            # - /Users/you/some/media:/media:ro
        expose:
            - "9000"

    # nginx — the web entrypoint on http://localhost:8080.
    web:
        image: nginx:1.27-alpine
        depends_on:
            - app
        ports:
            - "8080:80"
        volumes:
            - .:/var/www:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    # Vite dev server with HMR on http://localhost:5173. `npm install` runs into
    # the node_modules volume on first boot, then `npm run dev` (vite --host).
    vite:
        image: node:26-bookworm
        working_dir: /var/www
        env_file:
            - docker/app.env
        command: sh -c "npm install && npm run dev"
        ports:
            - "5173:5173"
        volumes:
            - .:/var/www
            - node_modules:/var/www/node_modules

volumes:
    pgdata:
    node_modules:
