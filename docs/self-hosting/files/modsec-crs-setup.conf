# /etc/nginx/modsec/crs-setup.conf
#
# This app's Core Rule Set choices. Read after the package's crs-setup.conf,
# which leaves both of these ids commented out. Defining them here is therefore
# the supported way to override the defaults in REQUEST-901-INITIALIZATION, not
# a collision.
#
# Paranoia level and anomaly thresholds stay at the CRS defaults (level 1,
# inbound 5): one critical match is enough to refuse a request.

# The app uses PUT, PATCH and DELETE, and Inertia sends the real verb rather
# than a `_method` field. CRS allows only GET HEAD POST OPTIONS by default and
# scores any other method as an attack. In blocking mode that refuses renaming a
# playlist, deleting one, renewing a share and every play-queue sync.
SecAction \
    "id:900200,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# The content types a request body may have. JSON is every write the app makes.
# urlencoded stays for a plain HTML form. Multipart is deliberately ABSENT: the
# app takes no uploads, so in blocking mode a multipart body is refused here as
# well, which also covers a vhost without nginx's 415 rule. XML and SOAP are
# absent for the same reason.
SecAction \
    "id:900220,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |application/json|'"
