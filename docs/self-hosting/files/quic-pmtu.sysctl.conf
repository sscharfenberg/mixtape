# /etc/sysctl.d/90-quic-pmtu.conf
#
# Path MTU over HTTP/3. nginx's QUIC finds the path MTU by probing (RFC 8899):
# a probe too big for the path is lost and nginx settles on the largest one
# that arrived. The kernel, though, also learns from a router's ICMP
# "fragmentation needed" — a DSL uplink over PPPoE carries 1492-byte packets,
# not 1500 — and from then on refuses every larger don't-fragment datagram with
# EMSGSIZE. nginx (1.26) treats that refusal as fatal and drops the whole QUIC
# connection, so the browser falls back to HTTP/2 and marks HTTP/3 broken for
# the site. One long transfer — a song — is enough to trigger it.
#
# 3 = accept fragmentation-needed only where the protocol can verify it (TCP,
# SCTP, DCCP) and ignore it for UDP. TCP path MTU discovery keeps working. The
# kernel documentation advises against this mode globally because it "could
# break other protocols": only UDP senders that rely on ICMP for their packet
# size, which a box running nginx, PostgreSQL and Samba does not have.
#
#   sudo install -m 644 quic-pmtu.sysctl.conf /etc/sysctl.d/90-quic-pmtu.conf
#   sudo sysctl -p /etc/sysctl.d/90-quic-pmtu.conf && sudo ip route flush cache
net.ipv4.ip_no_pmtu_disc = 3
