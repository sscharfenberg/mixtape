# Dependency updates and security advisories, as pull requests.
#
# TWO MECHANISMS, ONE FILE. Version updates are configured wholly below: the schedules, the
# groups, the ignore entry. Security updates are not — they are a repository setting
# (`vulnerability-alerts` for the detection, `automated-security-fixes` for the PRs, both on
# the REST API), and no key in this file can turn them on or off. What this file contributes
# to them is GROUPING, through a group carrying `applies-to: security-updates`. Read an
# absence here accordingly: it says nothing about whether advisories are being watched.
#
# They also ignore the schedule. `day: sunday` and `open-pull-requests-limit` govern version
# updates only; a security PR opens when the advisory lands, however many are already open.
# Grouping is therefore the one lever on their volume, and it batches what is outstanding at
# the same moment rather than deferring anything to the weekend.
#
# WHY THIS RATHER THAN AN AUDIT STEP IN CI. `composer audit` and `npm audit` fail a build for
# something the build did not break, on a schedule nobody chose — a fresh advisory turns the
# next unrelated push red. Worse, `npm audit` is famously noisy on a Vite/ESLint tree, where
# most findings sit in transitive devDependencies that never reach a browser, and the usual
# response to a gate that cries wolf is to switch it off. Dependabot puts the same information
# where it can be judged: a PR, with the changelog and the CI run attached.
#
# The trade is that nothing STOPS a vulnerable dependency shipping. That is the right way round
# here — this instance is deliberately internet-facing, but it is one household's server, and a
# blocked deploy on a Sunday is a worse failure than a day's delay patching a transitive dev
# dependency.
version: 2

updates:
    # The runtime code that actually faces the internet: Laravel, Fortify, Inertia, getID3.
    # Eight direct requirements, so the volume here is low and every PR is worth reading —
    # which is why no group below covers security updates either. An advisory against the
    # framework serving the site earns its own PR rather than a place in a batch.
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
          day: sunday
      open-pull-requests-limit: 5
      groups:
          # Laravel's own packages move together; separate PRs for framework, fortify and
          # tinker would conflict with each other on composer.lock.
          laravel:
              patterns:
                  - "laravel/*"

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: sunday
      open-pull-requests-limit: 5
      groups:
          # FORTY dev dependencies against seven runtime ones, and a bump to any of eslint,
          # vite, vitest or playwright usually drags its plugins with it. Grouped so the
          # tooling arrives as one reviewable PR rather than a dozen that each fail until the
          # others land.
          dev-tooling:
              dependency-type: development
              update-types:
                  - minor
                  - patch

          # The same forty, for advisories rather than releases — the half of `npm audit`'s
          # noise that never reaches a browser. Grouping is the only way to hold a wave of
          # transitive dev findings to one PR, security updates obeying neither the schedule
          # nor the open-PR limit.
          #
          # No `update-types` filter here, unlike the group above: a fix is worth taking at
          # whatever SemVer level it ships at, and naming levels would silently drop the
          # advisories that only a major answers. The seven RUNTIME dependencies are left out
          # of it on purpose — an advisory against Vue or Inertia is read on its own.
          dev-tooling-security:
              applies-to: security-updates
              dependency-type: development
      ignore:
          # TypeScript is held below 6.1 by ONE peer range — `@typescript-eslint/parser`
          # (reached through `@vue/eslint-config-typescript`) declares
          # `typescript: ">=4.8.4 <6.1.0"`, and 8.67.0, its latest, still does. So `~6.0.x` in
          # package.json is a ceiling, not a preference, and a bump past it fails `npm ci` on
          # the peer conflict before a single file compiles.
          #
          # A version range rather than `update-types: semver-major`, because the major is not
          # what breaks: 6.1 violates that peer exactly as 7.x does, so ignoring only majors
          # would keep proposing a minor that cannot install. Delete this entry outright when
          # the parser widens its range — nothing else here constrains TypeScript, `vue-tsc`
          # asks only for `>=5.0.0`.
          - dependency-name: typescript
            versions: [">=6.1.0"]

    # The workflow actions themselves. Pinned by major tag, so this is how a deprecated runner
    # image or a retired action version gets noticed before it stops working.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
