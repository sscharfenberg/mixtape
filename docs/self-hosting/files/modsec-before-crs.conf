# /etc/nginx/modsec/before-crs.conf
#
# Runtime exclusions, evaluated per request before the Core Rule Set. They run
# in phase 1, so they take effect before the body is read.
#
# Local rule ids are 10000–10099. CRS reserves 1–99,999 for local rules.
#
# Both rules match on REQUEST_FILENAME, the path without its query string, so
# they must be kept in step with routes/web.php and routes/web.auth.php.

# --- The bulk id lists: body not inspected -----------------------------------
# These routes take arrays of UUIDs and integers, and each one's FormRequest
# validates that exact shape server-side. The play-queue sync alone may carry
# 20,000 ids: twenty times SecArgumentsLimit. Without this exemption every CRS
# rule would run over every element on every track change. A UUID has nothing
# in it for a rule to find, so the body is skipped. Headers, cookies and the
# URL are still inspected.
#
# Every route that takes an id list must be listed here. In blocking mode, one
# that is missing answers 400 once its list passes 1,000 entries (rule 200007).
# That failure tends to show up months later, once a library is big enough to
# produce such a list.
SecRule REQUEST_FILENAME "@rx ^/(?:player/state|queue/tracks|playlists/order|playlists/[0-9a-f-]{36}/tracks(?:/order)?)$" \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:requestBodyAccess=Off"

# --- The credential routes: the raw body is never matched --------------------
# The password FIELDS are excluded everywhere in after-crs.conf. That still
# leaves a handful of rules that also read REQUEST_BODY, the raw JSON with the
# password inside it, and a matching rule's log line would quote it whole. On
# these routes that variable is removed from every rule.
SecRule REQUEST_FILENAME "@rx ^/(?:login|register|reset-password|confirm-password|two-factor-challenge|password/entropy|user/(?:password|delete|confirmed-two-factor-authentication))$" \
    "id:10002,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_BODY"
