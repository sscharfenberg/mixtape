# /etc/nginx/modsec/before-crs.conf
#
# Runtime rules for EVERY site nginx serves, evaluated per request before the
# Core Rule Set (phase 1, before the body is read). main.conf loads this file at
# http level, so only what is true of nginx or of every app on the box belongs
# here — protocol facts, never an app's routes. MixTape's own exclusions are in
# modsec/mixtape.conf, loaded by its vhosts (05-hardening.md §3).
#
# Local rule ids are 10000-10099 for MixTape and 10200-10299 for the shared rules
# in this file and after-crs.conf. CRS reserves 1-99,999 for local rules; give
# another app on the box a range of its own.

# --- HTTP/3 ------------------------------------------------------------------
# Over HTTP/3 the CRS would refuse every request: 920430 allows HTTP/1.0 to
# HTTP/2.0 only, and 920280 finds no Host header, because nginx takes HTTP/3's
# :authority as the server name without adding a Host header ModSecurity could
# see. Both are protocol checks, not attack signatures, and nginx has already
# matched the request to a site by name. Every other rule applies to HTTP/3 as
# to the rest. Harmless while no site listens on UDP 443.
SecRule REQUEST_PROTOCOL "@streq HTTP/3.0" "id:10200,phase:1,pass,nolog,t:none,ctl:ruleRemoveById=920430,ctl:ruleRemoveById=920280"
