# /etc/nginx/modsec/after-crs.conf
#
# Configure-time exclusions. These directives modify rules that already exist,
# so this file must be loaded AFTER the rule files.
#
# Tuning a false positive found in the audit log belongs here as well. Narrow
# it to one rule and one argument (SecRuleUpdateTargetById <id> "!ARGS:json.<field>")
# rather than switching a rule off. 05-hardening.md §3 shows how to read the log.

# --- Credentials are never matched, so they are never logged -----------------
# When a rule matches, the matched value is written to the audit log and, in
# blocking mode, to nginx's error log. A password is free text: `--`, quotes,
# angle brackets, words like `select`. That is exactly what the injection rules
# match, and the app deliberately keeps submitted passwords out of every log it
# writes (04-going-public.md, "A dedicated auth-failure log"). Excluding the
# fields keeps the WAF from undoing that. The app hashes these values or
# compares them; it never interprets them.
#
# libmodsecurity names a JSON argument by its path, `json.<key>`. The bare names
# cover a urlencoded body.
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:json.password"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:json.password_confirmation"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:json.current_password"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:json.p"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:json.code"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:json.recovery_code"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:password"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:password_confirmation"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:current_password"

# --- Laravel's own cookies: ciphertext ---------------------------------------
# The framework encrypts and MACs these, so a payload hidden in one cannot
# survive decryption, and a long base64 string is a classic source of false
# positives. The session cookie's name comes from APP_NAME
# (`Str::slug(APP_NAME).'-session'`) unless SESSION_COOKIE overrides it. Read
# the real name off a Set-Cookie header rather than assuming it:
#   curl -sI https://<your-domain>/login | grep -i set-cookie
SecRuleUpdateTargetByTag "OWASP_CRS" "!REQUEST_COOKIES:XSRF-TOKEN"
SecRuleUpdateTargetByTag "OWASP_CRS" "!REQUEST_COOKIES:mixtape-session"
SecRuleUpdateTargetByTag "OWASP_CRS" "!REQUEST_COOKIES:/^remember_web_/"
