# /etc/nginx/modsec/main.conf
#
# ModSecurity v3 + the OWASP Core Rule Set, configured for MixTape. Loaded once
# by conf.d/mixtape-modsecurity.conf and switched on per vhost, inside the PHP
# location.
#
# This file is written in full rather than copied from the sample config that
# ships with the nginx module, because three of that sample's defaults are wrong
# here (each is marked below):
#   - it writes request BODIES to the audit log for every 4xx, so a failed
#     login is stored with its password;
#   - its body limit is a sixteenth of nginx's, a second and smaller limit
#     that would answer 413 to a long play queue;
#   - it buffers HTML responses for leak-detection rules that have nothing to
#     find in this app.

# ONE SPACE between a directive and its value. Do not column-align them.
# libmodsecurity silently drops a line such as `SecAuditLog      /path`:
# `nginx -t` passes, the rules run, and the audit log never receives a line.

# --- Engine ------------------------------------------------------------------
# DetectionOnly: every rule runs and every match is logged, but nothing is
# refused. Stay in this mode until the audit log shows no false positives from
# real use, then set `On`. `Off` plus a reload is the kill switch.
SecRuleEngine DetectionOnly

# --- Request bodies ----------------------------------------------------------
SecRequestBodyAccess On

# Every write the app makes is JSON. Without this rule the body is parsed as
# urlencoded, yields no arguments, and the rules inspect nothing at all.
SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# Equal to nginx's client_max_body_size, so the WAF never becomes a second,
# smaller limit that answers 413 to a request nginx and PHP would both accept.
SecRequestBodyLimit 2097152
SecRequestBodyNoFilesLimit 2097152
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 512

# A JSON array becomes one argument per element (`json.tracks.array_0`, …).
# The bulk routes that legitimately send thousands of ids are exempted from
# body inspection in before-crs.conf instead of raising this limit. Raising it
# would run every rule over every element on every play-queue sync.
SecArgumentsLimit 1000
SecRule &ARGS "@ge 1000" \
    "id:200007,phase:2,t:none,log,deny,status:400,msg:'Failed to fully parse request body due to large argument count',severity:2"

SecRule REQBODY_ERROR "!@eq 0" \
    "id:200002,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"

SecPcreMatchLimit 1000
SecPcreMatchLimitRecursion 1000
SecRule TX:/^MSC_/ "!@streq 0" \
    "id:200005,phase:2,t:none,deny,msg:'ModSecurity internal error flagged: %{MATCHED_VAR_NAME}'"

# --- Responses ---------------------------------------------------------------
# Off (the sample turns it on). The response rules look for SQL errors and
# stack traces leaking into HTML. Production runs with APP_DEBUG=false and
# renders its own error pages, so there is nothing for them to find, and
# turning this on means buffering every page.
SecResponseBodyAccess Off

# --- Audit log ---------------------------------------------------------------
# An entry is written when a rule matched, or when the status is a 5xx. The
# sample also logs every 4xx except 404, but here a validation 422, a throttle
# 429 and a CSRF 419 are the app working normally, and logging them would bury
# the real matches.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^5"

# A B F H Z: transaction, request headers, response headers, rule messages.
# NO request body (parts I and C). The sample includes it, which stores every
# failed login with its password. The rule messages in H carry the matched
# fragment, and that is all tuning needs.
SecAuditLogParts ABFHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /var/log/modsecurity/audit.log

SecArgumentSeparator &
SecCookieFormat 0
SecUnicodeMapFile /etc/nginx/unicode.mapping 20127

# --- Core Rule Set -----------------------------------------------------------
# Load order, and why:
#   1. The package's setup file. It carries the required SecDefaultAction lines
#      and follows package updates.
#   2. This app's setup choices.
#   3. The runtime exclusions, which have to run before the rules do.
#   4. The rules themselves.
#   5. The configure-time exclusions, which can only name rules that already exist.
Include /etc/modsecurity/crs/crs-setup.conf
Include /etc/nginx/modsec/crs-setup.conf
Include /etc/nginx/modsec/before-crs.conf
Include /usr/share/modsecurity-crs/rules/*.conf
Include /etc/nginx/modsec/after-crs.conf
