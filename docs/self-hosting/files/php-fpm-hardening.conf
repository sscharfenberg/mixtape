# /etc/systemd/system/php8.4-fpm.service.d/hardening.conf
#
# Sandboxes php-fpm, the one process that runs code shaped by internet input.
# The distribution's unit ships with none of this. Each line removes something
# a compromised worker could otherwise reach, and none of them changes what a
# healthy request does.
#
# Apply with a RESTART; a reload does not rebuild the sandbox:
#   sudo systemctl daemon-reload && sudo systemctl restart php8.4-fpm
# To compare the exposure score before and after:
#   systemd-analyze security php8.4-fpm

[Service]
# THE MEDIA LIBRARY IS READ-ONLY TO PHP. It is owned by the web user, because
# the library scan (a separate unit, unaffected by this file) deletes junk files
# in it. Without this line a compromised worker could delete the only data whose
# loss is permanent. The web path only ever reads the library: covers are cached
# under storage/, while streams and downloads are reads.
ReadOnlyPaths=/var/media

# /usr, /boot and /etc read-only; /home and /root invisible; a /tmp shared with
# no other service.
ProtectSystem=full
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes

# A worker cannot gain privileges through a setuid binary (`su`, `sudo`, or a
# vulnerable one).
NoNewPrivileges=yes

ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictNamespaces=yes
SystemCallArchitectures=native

# UNIX for the fpm sockets, INET/INET6 for PostgreSQL and the mail relay.
# NETLINK because glibc's resolver uses it to ask which address families are
# configured; without it, looking up a hostname such as the SMTP relay's can fail.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK

# Deliberately NOT RestrictSUIDSGID=yes. The cover cache directory is created
# with the setgid bit (2775, so the web user and an admin running artisan can
# both clean it up), and that option refuses the chmod. CoverService suppresses
# that chmod's error, so the only symptom would be a cache directory that only
# one of the two users can delete from.
