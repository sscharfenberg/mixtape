# /etc/nginx/sites-available/mixtape.dev
#
# MixTape v2 — LAN development vhost. Self-signed TLS, no domain, no certbot.
# Set up in 02-host-setup.md §2.9 and the counterpart to mixtape.prod.nginx.conf.
#
# It differs from prod in four ways, each deliberate:
#   - self-signed certificate instead of Let's Encrypt (there is no domain yet)
#   - the SHARED php8.4-fpm socket, not an isolated pool (nothing to isolate from)
#   - no rate limiting — the abuse limits exist for an internet-facing box
#   - a CSP subset only (see the note below): Vite's HMR loads scripts and a wss
#     from the :5174 vhost, which a full resource policy would block
#
# TEMPLATE. Replace <your-dev-host> throughout before installing — it must match
# the CN of the self-signed certificate (typically <hostname>.local).
#
# NOTE ON default_server: this vhost owns it only until production exists.
# 03-production-deploy.md §9 hands the flag to prod, and it must come off all four
# listen lines here IN THE SAME CHANGE — two default_server blocks on one port is
# a hard error and `nginx -t` will refuse the reload, updating neither site.

server {                                    # HTTP -> HTTPS (+ ACME path kept)
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name <your-dev-host>;

    # Kept open from the start so nothing needs changing when certbot arrives.
    location /.well-known/acme-challenge/ { allow all; root /var/www/html; }
    location /                             { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name <your-dev-host>;

    root  /var/www/mixtape.dev/public;
    index index.php;

    ssl_certificate     /etc/ssl/certs/mixtape-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/mixtape-selfsigned.key;

    access_log /var/log/nginx/mixtape.dev.access.log;
    error_log  /var/log/nginx/mixtape.dev.error.log;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # --- Media hand-off (X-Accel-Redirect) --------------------------------
    # Identical to prod, and here for a reason that is not performance: this is
    # the ONLY box where the hand-off can be rehearsed. A workstation running
    # `php -S` has no nginx to interpret the header, so the accelerated path is
    # untestable there and every failure below would first appear in production.
    #
    # `internal` makes these locations unreachable from outside — a request
    # straight to /internal-media/... is a 404 — so the auth check in
    # SongStreamController is not bypassable.
    #
    # The trailing slashes on BOTH the location and the alias are load-bearing,
    # and each alias must match the matching MIXTAPE_*_PATH in .env. Reload nginx
    # with these in place BEFORE setting MIXTAPE_STREAM_INTERNAL_PREFIX — in
    # between, every stream 500s. See 03-production-deploy.md §9.
    location /internal-media/music/ {
        internal;
        alias /var/media/music/;
    }

    location /internal-media/audiobooks/ {
        internal;
        alias /var/media/audiobooks/;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\.(?!well-known).* { deny all; }

    # --- Security headers -------------------------------------------------
    # ALL header directives live in this server{} block on purpose: a single
    # add_header inside any location{} would drop every inherited header for
    # that location (nginx's header-inheritance trap).
    # `always` on every one: without it nginx omits the header from error
    # responses (4xx/5xx), which is exactly where an unstyled Laravel error page
    # or a directory listing would benefit from nosniff and SAMEORIGIN.
    add_header X-Content-Type-Options nosniff                        always;
    add_header X-Frame-Options        SAMEORIGIN                     always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # CSP (dev): resource-agnostic hardening ONLY. No default-src/script-src/
    # style-src/connect-src, so Vite HMR (scripts + a wss from :5174) keeps
    # working. The full resource policy is prod-only — see mixtape.prod.nginx.conf.
    # Consequence worth knowing: a CSP regression cannot surface here. Prod's
    # policy is exercised by the end-to-end suite instead.
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'" always;

    client_max_body_size 32M;
}
