# MixTape — local dev nginx vhost
# Serves public/ and forwards *.php to the php-fpm `app` service on :9000.
# Front-end assets in dev come from the Vite dev server (localhost:5173) via
# public/hot, so nginx only serves index.php and the static files in public/.

server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
    }

    # Deny dotfiles except ACME/.well-known.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
