# /etc/sysctl.d/99-hardening.conf
#
# Kernel and network hardening for a single-homed, internet-facing server.
# Replace <lan-interface> with the NIC's name (`ip -br link`), then apply it
# without a reboot:
#   sudo sysctl --system
# Check the values that are actually in effect, not the file. For example:
#   sysctl net.ipv4.conf.<lan-interface>.accept_redirects   # must read 0

# --- ICMP redirects and source routing ---------------------------------------
# `all` ON ITS OWN DOES NOT TURN IPv4 REDIRECTS OFF. On a host that does not
# forward, an interface accepts redirects while EITHER `all` OR its own value is
# 1, and its own value defaults to 1. A file that sets only
# `net.ipv4.conf.all.accept_redirects = 0` looks hardened and changes nothing.
# IPv6 reads only the interface's value. So each setting is written three times:
# `all`; `default`, for interfaces that appear later (a USB NIC); and the real
# interface by name. systemd re-applies the named interface's keys when that
# interface appears, so boot ordering does not matter.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.<lan-interface>.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.<lan-interface>.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.<lan-interface>.secure_redirects = 0

# Sending redirects is a router's job.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.<lan-interface>.send_redirects = 0

net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1

# Reverse-path filtering is left at systemd's per-interface default of 2
# (loose). The kernel uses the higher of `all` and the interface's value, so a
# `net.ipv4.conf.all.rp_filter = 1` here would not make it strict anyway.
# Strict filtering buys nothing on a single-homed host.

# --- Processes ---------------------------------------------------------------
# A process may only ptrace its own descendants; root still may ptrace anything.
# Without this, any process can attach to every other process of the same user,
# so code running as the web user could read another php-fpm worker's memory:
# the request in flight, its session, a password being hashed. php-fpm's slow
# log still works, because the master that traces a stuck worker is its parent.
kernel.yama.ptrace_scope = 1

# Unprivileged user namespaces are the entry point for a large share of local
# kernel exploits, and nothing on a server like this needs them. (This key is
# Debian- and Ubuntu-specific.)
kernel.unprivileged_userns_clone = 0

kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# One-way: this cannot be turned back on before the next boot.
kernel.kexec_load_disabled = 1
net.core.bpf_jit_harden = 2
dev.tty.ldisc_autoload = 0

fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0
