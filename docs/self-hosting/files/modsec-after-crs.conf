# /etc/nginx/modsec/after-crs.conf
#
# Configure-time exclusions for EVERY site nginx serves. These directives modify
# rules that already exist, so this file must be loaded AFTER the rule files.
# MixTape's own exclusions are runtime rules in modsec/mixtape.conf: a file
# loaded by a vhost cannot edit the parent's rules (05-hardening.md §3).
#
# Tuning a false positive found in the audit log: narrow it to one rule and one
# argument, in mixtape.conf (`ctl:ruleRemoveTargetById=<id>;ARGS:json.<field>`)
# rather than switching a rule off. 05-hardening.md §3 shows how to read the log.

# --- The framework's own cookies: ciphertext ---------------------------------
# These names are Laravel's, not the app's, so they hold for any Laravel app on
# the box. The framework encrypts and MACs them, so a payload hidden in one
# cannot survive decryption, and a long base64 string is a classic source of
# false positives. The session cookie carries the app's own name and is
# exempted in mixtape.conf.
SecRuleUpdateTargetByTag "OWASP_CRS" "!REQUEST_COOKIES:XSRF-TOKEN"
SecRuleUpdateTargetByTag "OWASP_CRS" "!REQUEST_COOKIES:/^remember_web_/"
