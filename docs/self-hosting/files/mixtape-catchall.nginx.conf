# /etc/nginx/sites-available/mixtape-catchall
#
# The default server for every request that names no site this box serves — a
# bare IP, an unknown Host, or no SNI at all. It answers nothing.
#
# WHY IT EXISTS. Address-range scanners do not know your hostname: they connect
# to the IP and send whatever Host they like. Without this block the
# `default_server` is production, so every one of them is handed the real app,
# and the TLS handshake presents prod's certificate, which names the site.
# With it, port 80 closes the connection and port 443 refuses the handshake, so
# the app answers only somebody who already knows its name.
#
# It does not hide the site from someone looking for it: every Let's Encrypt
# certificate is published in the Certificate Transparency logs. What it removes
# is the drive-by.
#
# It takes `default_server` from the prod vhost, which must drop the flag from
# its four listen lines IN THE SAME CHANGE. Two default servers on one port is a
# hard error, and `nginx -t` refuses the whole reload.
#
# Install:
#   sudo install -m 644 mixtape-catchall.nginx.conf /etc/nginx/sites-available/mixtape-catchall
#   sudo ln -s /etc/nginx/sites-available/mixtape-catchall /etc/nginx/sites-enabled/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 444 is nginx's "close the connection, send nothing". Let's Encrypt's
    # HTTP-01 challenge is unaffected: it asks for the certificate's own name,
    # which the prod vhost matches, so the request never reaches this block.
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Refuses the handshake itself, so this block needs no certificate of its
    # own and never presents prod's.
    ssl_reject_handshake on;
}
