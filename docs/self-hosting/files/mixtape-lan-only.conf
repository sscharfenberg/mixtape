# /etc/nginx/snippets/mixtape-lan-only.conf
#
# Restricts a server{} to the LAN. `include` it in every server block of the dev
# vhost and of the Vite dev-server proxy.
#
# WHY THE FIREWALL CANNOT DO THIS. Once 80/443 are forwarded for production they
# are open to the internet for EVERY vhost listening on them. nftables sees a
# port, not a Host header, so anybody who sends `Host: <your-dev-host>` to your
# public IP reaches the dev site, with `APP_DEBUG=true` and whatever is in its
# database. nginx is the first thing that knows which site was asked for, so
# nginx has to refuse.
#
# This works behind a home router because the port-forward is plain NAT: the
# source address survives, so `$remote_addr` is the real client.
#
# A LAN MACHINE THAT GOES THROUGH THE PUBLIC IP IS NOT ON THE LAN HERE. The
# router hairpins that connection and nginx sees your WAN address. That is also
# how to test this rule from inside the house; see 05-hardening.md §5.
#
# No IPv6 line is needed while the firewall admits the web ports over IPv4
# only. If you open them over IPv6, add your LAN's ULA prefix here. Do not add
# the GUA prefix: your ISP can change it.
#
# A `return` in a location runs before these checks (the rewrite phase precedes
# the access phase), so the dev vhost's port-80 redirect still answers an
# outsider with a 301. The redirect points at the HTTPS site this rule refuses,
# so nothing is served.

allow 127.0.0.1;
allow ::1;
allow <lan-subnet>;
deny  all;
